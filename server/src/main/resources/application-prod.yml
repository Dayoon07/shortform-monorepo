# 운영 프로파일: SPRING_PROFILES_ACTIVE=prod 로 활성화
# application.yml(공통)을 오버라이드해서 보안/안정성을 강화하고,
# 필수 시크릿/URL이 없으면 기동 단계에서 실패(fail-fast)하도록 한다.
#
# [운영에 반드시 주입해야 하는 환경변수]
#   ORACLE_DB_URL, ORACLE_DB_PASSWORD
#   JWT_SECRET (64바이트 이상 강한 값), AES_SECRET_KEY (정확히 32자)
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
#   CORS_ALLOWED_ORIGINS, OAUTH_SUCCESS_REDIRECT
#   S3_BUCKET, AWS_ACCESS_KEY, AWS_SECRET_KEY (STORAGE_TYPE=s3 기본)
#   RABBITMQ_HOST/USER/PASS (RABBITMQ_ENABLED=true 기본)
#   ADMIN_EMAILS

spring:
  jpa:
    show-sql: false
    hibernate:
      # 운영은 스키마 자동변경 금지 — 변경은 Flyway 마이그레이션으로만
      ddl-auto: validate
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:50}
      minimum-idle: ${DB_POOL_MIN:10}

server:
  error:
    whitelabel:
      enabled: false   # 화이트라벨 에러 페이지(정보 노출) 비활성

jwt:
  # 기본값 제거 → 미설정 시 기동 실패 (약한 시크릿로 운영되는 사고 방지)
  secret: ${JWT_SECRET}

aes:
  secret-key: ${AES_SECRET_KEY}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}      # 운영 도메인 필수
  oauth2:
    success-redirect: ${OAUTH_SUCCESS_REDIRECT}   # 운영 콜백 URL 필수
  storage:
    type: ${STORAGE_TYPE:s3}     # 운영은 S3 (버킷/키 env 필요)
    s3:
      base-prefix: ${S3_PREFIX:production}   # 버킷 내 production/ 폴더에 저장
  rabbitmq:
    enabled: ${RABBITMQ_ENABLED:true}

springdoc:
  swagger-ui:
    enabled: false   # 운영에선 API 문서 비공개
  api-docs:
    enabled: false

logging:
  level:
    root: warn
    com.e.shortform: info
