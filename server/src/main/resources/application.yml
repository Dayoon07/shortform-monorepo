spring:
  application:
    name: shortform
  devtools:
    restart:
      enabled: false
  thymeleaf:
    mode: HTML
    prefix: classpath:/templates/
    suffix: .html
  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 150MB
  datasource:
    url: ${ORACLE_DB_URL}
    driver-class-name: oracle.jdbc.OracleDriver
    username: C##FIN
    password: ${ORACLE_DB_PASSWORD}
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
      connection-timeout: 10000
      idle-timeout: 10000
      max-lifetime: 580000
      auto-commit: true
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 200
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: update
    # properties:
    #   hibernate:
    #     dialect: org.hibernate.dialect.OracleDialect
  cloud:
    aws:
      s3:
        region: ap-northeast-2
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            scope: email, profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
            user-name-attribute: email
  flyway:
    # enabled: false
    baseline-version: 1
    baseline-on-migrate: true
    locations: classpath:db/migration
    url: ${ORACLE_DB_URL}
    user: C##FIN
    password: ${ORACLE_DB_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
      # password:
      # database: 0
      lettuce:
        pool:
          enabled: true
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

server:
  port: 9005
  address: 0.0.0.0
  error:
    whitelabel:
      enabled: true
  servlet:
    encoding:
      charset: UTF-8
    session:
      timeout: 20h
    context-path: /
  forward-headers-strategy: native
  tomcat:
    threads:
      max: 500
    connection-timeout: 60000

mybatis:
  mapper-locations: classpath:/mappers/*/*.xml
  type-aliases-package: com.e.shortform.domain.*.res, com.e.shortform.domain.*.vo

logging:
  level:
    com.zaxxer.hikari: warn

jwt:
  secret: ${JWT_SECRET:LoremaipsumadolorasitaametaconsecteturaaadipisicingaelitaaVoluptasanatusaasapienteaundeacommodiaharumaprovidentanobisaaRecusandaeaatemporeaprovidentaquasiahicaminimaaveroalaboriosamavoluptatesanonaminusamagniaenimavoluptatibus}
  expiration: 86400000

# AES-256 키는 정확히 32자(=32바이트)여야 한다. 운영에서는 AES_SECRET_KEY 환경변수로 주입.
aes:
  secret-key: ${AES_SECRET_KEY:0123456789abcdef0123456789abcdef}

# 환경별로 달라지는 URL은 하드코딩하지 말고 여기서 주입(서브도메인 배포 대비).
app:
  cors:
    # 콤마로 여러 오리진 지정 가능: https://app.example.com,https://admin.example.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  oauth2:
    success-redirect: ${OAUTH_SUCCESS_REDIRECT:http://localhost:3000/shortform-client/oauth/callback}
  admin:
    # 관리자 이메일 화이트리스트(콤마 구분). 신고 처리 등 관리자 기능 접근 권한.
    emails: ${ADMIN_EMAILS:gangd0642@gmail.com}

management:
  # actuator를 앱(9005)과 분리된 내부 포트로 노출한다. 리버스 프록시/서브도메인은
  # 9005만 포워딩하고 이 포트는 외부에 열지 말 것 → metrics/prometheus가 공개되지 않는다.
  server:
    port: ${MANAGEMENT_PORT:9090}
    address: 0.0.0.0
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: shortform

springdoc:
  swagger-ui:
    path: /swagger-ui.html      # Swagger UI 활성화 여부 (기본값: true)
    enabled: true               # 태그 정렬 방식 (기본값: alpha - 알파벳 순)
    tags-sorter: alpha          # Operation 정렬 방식 (기본값: method - HTTP 메서드 순)
    operations-sorter: method   # OpenAPI 문서(JSON/YAML)의 경로 설정 (기본값: /v3/api-docs)
    groups-order: desc
  api-docs:
    path: /api-docs             # 문서화할 API 경로 패턴 지정
  paths-to-match:
    - /api/**                   # 기본 Request 미디어 타입
  default-consumes-media-type: application/json;charset=UTF-8   # 기본 Response 미디어 타입
  default-produces-media-type: application/json;charset=UTF-8